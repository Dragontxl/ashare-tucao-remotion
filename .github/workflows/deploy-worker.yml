name: 部署 Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/static/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Worker 依赖
        working-directory: worker
        run: npm install

      - name: 部署到 Cloudflare Workers
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Secrets 不能写在 wrangler.toml 中（wrangler 不展开 ${VAR}），
      # 必须用 `wrangler secret put` 单独上传。
      - name: 配置 Worker Secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          for name in GITHUB_PAT AGNES_API_KEY; do
            value="$(printenv "$name")"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::warning::secret $name is empty, skipped"
            fi
          done
